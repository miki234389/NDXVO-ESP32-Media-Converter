name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to stamp into the app — MAJOR.MINOR.PATCH, optionally with a pre-release suffix. Examples: 1.0.0, 1.2.3, 2.0.0-rc1, 1.4.0-beta.2. Do NOT put a leading "v".'
        required: true
        default: "1.0.0"
      release:
        description: "Also tag this commit as v<version> and publish a GitHub Release. Leave off for a test build."
        type: boolean
        default: false

permissions:
  contents: read

env:
  APP_NAME: "NDXVO Media Converter"
  PYTHON_VERSION: "3.12"
  # Static ffmpeg comes from the imageio-ffmpeg wheels: one pinned version,
  # native binaries for both targets, no scraping of ad-hoc download pages.
  IMAGEIO_FFMPEG_VERSION: "0.6.0"
  # The FFmpeg release those binaries were built from. The bundled ffmpeg is
  # GPL, so this source tarball is attached to every Release; collect_licenses.py
  # fails the build if the binary is a different version. Bump all three together
  # (the checksum is from https://ffmpeg.org/releases/, signature-verified).
  FFMPEG_SOURCE_VERSION: "7.1"
  FFMPEG_SOURCE_SHA256: "40973d44970dbc83ef302b0609f2e74982be2d85916dd2ee7472d30678a7abe6"
  # The -lite variant bundles a minimal LGPL ffmpeg that build-ffmpeg-lite.sh
  # compiles from this release (signature-verified checksum, as above). Its
  # tarball is attached to every Release too. The build is cached; a change
  # here or in the script invalidates the cache.
  FFMPEG_LITE_VERSION: "7.1.5"
  FFMPEG_LITE_SHA256: "de668509caf9e35e3cd162473441fdb29538c6d96ed080292b3cf9e6fc5d558f"

jobs:
  # ------------------------------------------------------------ preflight ---
  # Resolve the version once, so both build jobs are guaranteed to stamp the
  # same value, and so a malformed version or an already-taken tag fails in
  # seconds instead of after a full build.
  preflight:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      release: ${{ steps.mode.outputs.release }}
    steps:
      - uses: actions/checkout@v6

      - name: Resolve version
        id: ver
        shell: bash
        run: bash .github/scripts/resolve-version.sh
        env:
          INPUT_VERSION: ${{ inputs.version }}

      - name: Decide whether this run publishes
        id: mode
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "Tag push — the tag already exists, a Release will be published."
            echo "release=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ inputs.release }}" = "true" ]; then
            echo "Manual run with 'release' ticked — a tag will be created and a Release published."
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "Test build — artifacts only, no tag and no Release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Make sure the tag is still free
        if: github.event_name == 'workflow_dispatch' && inputs.release
        shell: bash
        run: |
          TAG="v${{ steps.ver.outputs.version }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists. Choose a different version, or delete the existing tag first."
            exit 1
          fi
          echo "Tag $TAG is free."

  # ---------------------------------------------------------------- macOS ---
  # Two variants per platform, released side by side. "full" bundles the
  # imageio-ffmpeg GPL build with every codec. "lite" bundles the minimal LGPL
  # build from build-ffmpeg-lite.sh and carries a -lite suffix in every file and
  # artifact name.
  macos:
    name: macOS (Apple Silicon, ${{ matrix.variant }})
    needs: preflight
    runs-on: macos-14          # arm64 runner
    strategy:
      # A failing variant must not cancel the other one's test build; release
      # still waits for all of them.
      fail-fast: false
      matrix:
        variant: [full, lite]
        include:
          - variant: full
            suffix: ""
          - variant: lite
            suffix: "-lite"
    env:
      SUFFIX: ${{ matrix.suffix }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Stamp the version into the app
        shell: bash
        run: python .github/scripts/stamp_version.py "${{ needs.preflight.outputs.version }}"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow pyinstaller
          if [ "${{ matrix.variant }}" = full ]; then
            python -m pip install "imageio-ffmpeg==${IMAGEIO_FFMPEG_VERSION}"
          fi

      - name: Restore the lite ffmpeg from the cache
        id: lite-cache
        if: matrix.variant == 'lite'
        uses: actions/cache@v6
        with:
          path: vendor/ffmpeg-lite
          key: ffmpeg-lite-macos-arm64-${{ env.FFMPEG_LITE_VERSION }}-${{ hashFiles('.github/scripts/build-ffmpeg-lite.sh') }}

      - name: Build the lite ffmpeg
        if: matrix.variant == 'lite' && steps.lite-cache.outputs.cache-hit != 'true'
        run: bash .github/scripts/build-ffmpeg-lite.sh "$FFMPEG_LITE_VERSION" "$FFMPEG_LITE_SHA256" vendor/ffmpeg-lite/ffmpeg

      - name: Stage the ffmpeg binary
        run: |
          mkdir -p vendor
          if [ "${{ matrix.variant }}" = lite ]; then
            cp vendor/ffmpeg-lite/ffmpeg vendor/ffmpeg
          else
            cp "$(python -c 'import imageio_ffmpeg, sys; sys.stdout.write(imageio_ffmpeg.get_ffmpeg_exe())')" vendor/ffmpeg
          fi
          chmod +x vendor/ffmpeg
          file vendor/ffmpeg
          vendor/ffmpeg -version | head -1

      - name: Smoke-test ffmpeg with the converter's own commands
        run: python .github/scripts/smoke_test_ffmpeg.py vendor/ffmpeg

      - name: Collect third-party licenses
        run: |
          if [ "${{ matrix.variant }}" = lite ]; then
            ORIGIN=(--ffmpeg-source-version "$FFMPEG_LITE_VERSION"
                    --built-with .github/scripts/build-ffmpeg-lite.sh)
          else
            ORIGIN=(--ffmpeg-source-version "$FFMPEG_SOURCE_VERSION"
                    --imageio-ffmpeg-version "$IMAGEIO_FFMPEG_VERSION")
          fi
          python .github/scripts/collect_licenses.py \
            --ffmpeg vendor/ffmpeg \
            --platform "macOS arm64${SUFFIX:+ lite}" \
            --app-version "${{ needs.preflight.outputs.version }}" \
            "${ORIGIN[@]}" \
            --release-url "${{ github.server_url }}/${{ github.repository }}/releases/tag/v${{ needs.preflight.outputs.version }}" \
            --out vendor/licenses

      - name: Build the .app bundle
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir \
            --name "$APP_NAME" \
            --osx-bundle-identifier "net.ndxvo.esp32converter" \
            --add-binary "vendor/ffmpeg:." \
            --add-data "vendor/licenses:licenses" \
            --hidden-import "PIL._tkinter_finder" \
            ndxvo_converter.py

      - name: Write the version into Info.plist
        # Must happen before signing - editing a bundle invalidates its signature.
        run: |
          V="${{ needs.preflight.outputs.version }}"
          PLIST="dist/$APP_NAME.app/Contents/Info.plist"
          plutil -replace CFBundleShortVersionString -string "$V" "$PLIST"
          plutil -replace CFBundleVersion -string "$V" "$PLIST"
          plutil -p "$PLIST" | grep -i bundle

      - name: Ad-hoc sign the bundle
        # Without a signature macOS refuses to launch an app that contains an
        # unsigned helper binary.  This is not notarisation - see the README for
        # the one-off quarantine step users need on first launch.
        run: |
          codesign --force --deep --sign - "dist/$APP_NAME.app"
          codesign --verify --deep --strict --verbose=2 "dist/$APP_NAME.app"

      - name: Package as .dmg
        run: |
          V="${{ needs.preflight.outputs.version }}"
          mkdir -p dmg out
          cp -R "dist/$APP_NAME.app" dmg/
          cp -R vendor/licenses "dmg/Licenses"
          ln -s /Applications "dmg/Applications"
          hdiutil create -volname "$APP_NAME" -srcfolder dmg -ov -format UDZO \
            "out/NDXVO-Media-Converter-$V-macOS-arm64$SUFFIX.dmg"
          ls -la out/

      - name: Verify ffmpeg is inside the .app inside the .dmg
        # Mounts the finished disk image and runs the ffmpeg that is actually
        # shipped, so a build can never be published with ffmpeg missing.
        run: |
          V="${{ needs.preflight.outputs.version }}"
          DMG="out/NDXVO-Media-Converter-$V-macOS-arm64$SUFFIX.dmg"
          MP="$(mktemp -d)"
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$MP"
          FF="$MP/$APP_NAME.app/Contents/Frameworks/ffmpeg"
          if [ ! -x "$FF" ]; then
            echo "::error::ffmpeg is NOT inside the app bundle shipped in the .dmg"
            find "$MP/$APP_NAME.app" -name 'ffmpeg*' -print || true
            hdiutil detach "$MP" || true
            exit 1
          fi
          echo "Bundled ffmpeg: $(stat -f%z "$FF") bytes"
          "$FF" -version | head -1
          if [ ! -f "$MP/Licenses/THIRD-PARTY-NOTICES.txt" ] ||
             [ -z "$(find "$MP/$APP_NAME.app" -path '*/licenses/THIRD-PARTY-NOTICES.txt' | head -n 1)" ]; then
            echo "::error::The license notices are missing from the .dmg or from the app bundle"
            hdiutil detach "$MP" || true
            exit 1
          fi
          echo "License notices are in the .dmg and in the app bundle."
          echo "App bundle total: $(du -sh "$MP/$APP_NAME.app" | cut -f1)"
          hdiutil detach "$MP"

      - uses: actions/upload-artifact@v7
        with:
          name: macos-arm64${{ matrix.suffix }}-dmg-${{ needs.preflight.outputs.version }}
          path: "out/*.dmg"

      - uses: actions/upload-artifact@v7
        with:
          name: notices-macos-arm64${{ matrix.suffix }}
          path: vendor/licenses

  # -------------------------------------------------------------- Windows ---
  # Same two variants as macOS. The lite ffmpeg is compiled in MSYS2 (gcc and
  # nasm), which is only set up when the cache misses.
  windows:
    name: Windows (x64, ${{ matrix.variant }})
    needs: preflight
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [full, lite]
        include:
          - variant: full
            suffix: ""
          - variant: lite
            suffix: "-lite"
    env:
      SUFFIX: ${{ matrix.suffix }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Stamp the version into the app
        shell: bash
        run: python .github/scripts/stamp_version.py "${{ needs.preflight.outputs.version }}"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow pyinstaller
          if ("${{ matrix.variant }}" -eq "full") {
            python -m pip install "imageio-ffmpeg==$env:IMAGEIO_FFMPEG_VERSION"
          }

      - name: Restore the lite ffmpeg from the cache
        id: lite-cache
        if: matrix.variant == 'lite'
        uses: actions/cache@v6
        with:
          path: vendor/ffmpeg-lite
          key: ffmpeg-lite-windows-x64-${{ env.FFMPEG_LITE_VERSION }}-${{ hashFiles('.github/scripts/build-ffmpeg-lite.sh') }}

      - name: Set up MSYS2 for the lite ffmpeg build
        if: matrix.variant == 'lite' && steps.lite-cache.outputs.cache-hit != 'true'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            make diffutils curl tar xz
            mingw-w64-x86_64-gcc mingw-w64-x86_64-nasm
            mingw-w64-x86_64-pkgconf mingw-w64-x86_64-zlib

      - name: Build the lite ffmpeg
        if: matrix.variant == 'lite' && steps.lite-cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: bash .github/scripts/build-ffmpeg-lite.sh "$FFMPEG_LITE_VERSION" "$FFMPEG_LITE_SHA256" vendor/ffmpeg-lite/ffmpeg.exe

      - name: Stage the ffmpeg binary
        run: |
          New-Item -ItemType Directory -Force -Path vendor | Out-Null
          if ("${{ matrix.variant }}" -eq "lite") {
            Copy-Item vendor\ffmpeg-lite\ffmpeg.exe vendor\ffmpeg.exe
          } else {
            $ff = python -c "import imageio_ffmpeg, sys; sys.stdout.write(imageio_ffmpeg.get_ffmpeg_exe())"
            Copy-Item $ff vendor\ffmpeg.exe
          }
          .\vendor\ffmpeg.exe -version | Select-Object -First 1

      - name: Smoke-test ffmpeg with the converter's own commands
        run: python .github/scripts/smoke_test_ffmpeg.py vendor/ffmpeg.exe

      - name: Collect third-party licenses
        shell: bash
        run: |
          if [ "${{ matrix.variant }}" = lite ]; then
            ORIGIN=(--ffmpeg-source-version "$FFMPEG_LITE_VERSION"
                    --built-with .github/scripts/build-ffmpeg-lite.sh)
          else
            ORIGIN=(--ffmpeg-source-version "$FFMPEG_SOURCE_VERSION"
                    --imageio-ffmpeg-version "$IMAGEIO_FFMPEG_VERSION")
          fi
          python .github/scripts/collect_licenses.py \
            --ffmpeg vendor/ffmpeg.exe \
            --platform "Windows x64${SUFFIX:+ lite}" \
            --app-version "${{ needs.preflight.outputs.version }}" \
            "${ORIGIN[@]}" \
            --release-url "${{ github.server_url }}/${{ github.repository }}/releases/tag/v${{ needs.preflight.outputs.version }}" \
            --out vendor/licenses

      - name: Build the .exe
        run: |
          pyinstaller --noconfirm --clean --windowed --onefile `
            --name "$env:APP_NAME" `
            --add-binary "vendor/ffmpeg.exe;." `
            --add-data "vendor/licenses;licenses" `
            --hidden-import "PIL._tkinter_finder" `
            ndxvo_converter.py

      - name: Collect the artifact
        shell: bash
        run: |
          mkdir -p out
          mv "dist/$APP_NAME.exe" \
             "out/NDXVO-Media-Converter-${{ needs.preflight.outputs.version }}-Windows-x64$SUFFIX.exe"
          ls -la out/

      - name: Verify ffmpeg is inside the .exe
        # Reads the PyInstaller CArchive appended to the one-file executable and
        # asserts ffmpeg.exe is one of its entries.
        shell: bash
        run: |
          EXE="out/NDXVO-Media-Converter-${{ needs.preflight.outputs.version }}-Windows-x64$SUFFIX.exe"
          ls -l "$EXE"
          LISTING="$(python -m PyInstaller.utils.cliutils.archive_viewer --list --brief "$EXE" | tr ',' '\n')"
          echo "$LISTING" | grep -qi 'ffmpeg\.exe' \
            || { echo "::error::ffmpeg.exe is NOT embedded in the one-file .exe"; exit 1; }
          echo "ffmpeg.exe is embedded in the one-file executable."
          echo "$LISTING" | grep -qiE 'licenses[\\/]+THIRD-PARTY-NOTICES\.txt' \
            || { echo "::error::The license notices are NOT embedded in the one-file .exe"; exit 1; }
          echo "License notices are embedded in the one-file executable."

      - uses: actions/upload-artifact@v7
        with:
          name: windows-x64${{ matrix.suffix }}-exe-${{ needs.preflight.outputs.version }}
          path: "out/*.exe"

      - uses: actions/upload-artifact@v7
        with:
          name: notices-windows-x64${{ matrix.suffix }}
          path: vendor/licenses

  # -------------------------------------------------------------- release ---
  # Runs only after EVERY build succeeds (both platforms, both variants), so a
  # tag is never created for a version that failed to build anywhere.
  release:
    name: Tag and publish
    needs: [preflight, macos, windows]
    if: needs.preflight.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Download the binaries
        uses: actions/download-artifact@v7
        with:
          # Binary artifacts end in -<version>; the notices-* ones do not, and
          # are zipped separately below.
          pattern: "*-${{ needs.preflight.outputs.version }}"
          path: assets
          merge-multiple: true

      - name: Download the license notices
        uses: actions/download-artifact@v7
        with:
          pattern: "notices-*"
          path: notices

      - name: Attach the license notices and the FFmpeg source
        # The bundled ffmpeg builds are GPL (full) and LGPL (lite): their
        # license texts and source code have to be offered from the same place
        # as the binaries. This runs before the tag is created, so a failed
        # download never leaves a tag behind.
        run: |
          V="${{ needs.preflight.outputs.version }}"
          cd notices
          for d in notices-*; do mv "$d" "${d#notices-}"; done
          zip -qr "../assets/NDXVO-Media-Converter-$V-licenses.zip" .
          cd ..
          fetch_source() {
            TARBALL="ffmpeg-$1.tar.xz"
            curl -fsSL --retry 3 -o "assets/$TARBALL" "https://ffmpeg.org/releases/$TARBALL"
            echo "$2  assets/$TARBALL" | sha256sum -c -
          }
          fetch_source "$FFMPEG_SOURCE_VERSION" "$FFMPEG_SOURCE_SHA256"
          if [ "$FFMPEG_LITE_VERSION" != "$FFMPEG_SOURCE_VERSION" ]; then
            fetch_source "$FFMPEG_LITE_VERSION" "$FFMPEG_LITE_SHA256"
          fi

      - name: Show what will be published
        run: ls -la assets

      - name: Create the tag
        # On a tag push the tag already exists; only a manual run creates one.
        if: github.event_name == 'workflow_dispatch'
        run: |
          TAG="v${{ needs.preflight.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
          echo "Created and pushed $TAG at ${{ github.sha }}"

      - name: Publish the release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "v${{ needs.preflight.outputs.version }}"
          name: "v${{ needs.preflight.outputs.version }}"
          files: assets/*
          fail_on_unmatched_files: true
          body: |
            Each platform comes in two variants that work the same and differ only in the bundled FFmpeg:

            - **Standard** (`…-Windows-x64.exe`, `…-macOS-arm64.dmg`): FFmpeg ${{ env.FFMPEG_SOURCE_VERSION }} with every codec, licensed under the GPL.
            - **Lite** (`…-lite.exe`, `…-lite.dmg`): a much smaller FFmpeg ${{ env.FFMPEG_LITE_VERSION }} build, licensed under the LGPL. It opens MP4, MOV, MKV, WebM, AVI, MPG, TS, WMV, FLV and OGV with H.264, HEVC, VP8, VP9, MPEG-1/2/4, WMV, ProRes or Theora video, plus JPG, PNG, BMP, GIF, WebP and TIFF images. It does not open AV1 video.

            Either variant runs FFmpeg as a separate program and can be pointed at another ffmpeg from the ffmpeg row in the app.

            - License texts and build details: `NDXVO-Media-Converter-${{ needs.preflight.outputs.version }}-licenses.zip` (on macOS also in the `Licenses` folder of the .dmg)
            - FFmpeg source code: `ffmpeg-${{ env.FFMPEG_SOURCE_VERSION }}.tar.xz` (standard) and `ffmpeg-${{ env.FFMPEG_LITE_VERSION }}.tar.xz` (lite)
