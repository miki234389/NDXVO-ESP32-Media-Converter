name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to stamp into the app — MAJOR.MINOR.PATCH, optionally with a pre-release suffix. Examples: 1.0.0, 1.2.3, 2.0.0-rc1, 1.4.0-beta.2. Do NOT put a leading "v".'
        required: true
        default: "1.0.0"
      release:
        description: "Also tag this commit as v<version> and publish a GitHub Release. Leave off for a test build."
        type: boolean
        default: false

permissions:
  contents: read

env:
  APP_NAME: "NDXVO Media Converter"
  PYTHON_VERSION: "3.12"
  # Static ffmpeg comes from the imageio-ffmpeg wheels: one pinned version,
  # native binaries for both targets, no scraping of ad-hoc download pages.
  IMAGEIO_FFMPEG_VERSION: "0.6.0"

jobs:
  # ------------------------------------------------------------ preflight ---
  # Resolve the version once, so both build jobs are guaranteed to stamp the
  # same value, and so a malformed version or an already-taken tag fails in
  # seconds instead of after a full build.
  preflight:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      release: ${{ steps.mode.outputs.release }}
    steps:
      - uses: actions/checkout@v6

      - name: Resolve version
        id: ver
        shell: bash
        run: bash .github/scripts/resolve-version.sh
        env:
          INPUT_VERSION: ${{ inputs.version }}

      - name: Decide whether this run publishes
        id: mode
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "Tag push — the tag already exists, a Release will be published."
            echo "release=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ inputs.release }}" = "true" ]; then
            echo "Manual run with 'release' ticked — a tag will be created and a Release published."
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "Test build — artifacts only, no tag and no Release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Make sure the tag is still free
        if: github.event_name == 'workflow_dispatch' && inputs.release
        shell: bash
        run: |
          TAG="v${{ steps.ver.outputs.version }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists. Choose a different version, or delete the existing tag first."
            exit 1
          fi
          echo "Tag $TAG is free."

  # ---------------------------------------------------------------- macOS ---
  macos:
    name: macOS (Apple Silicon)
    needs: preflight
    runs-on: macos-14          # arm64 runner
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Stamp the version into the app
        shell: bash
        run: python .github/scripts/stamp_version.py "${{ needs.preflight.outputs.version }}"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow pyinstaller "imageio-ffmpeg==${IMAGEIO_FFMPEG_VERSION}"

      - name: Extract the static ffmpeg binary
        run: |
          FF="$(python -c 'import imageio_ffmpeg, sys; sys.stdout.write(imageio_ffmpeg.get_ffmpeg_exe())')"
          mkdir -p vendor
          cp "$FF" vendor/ffmpeg
          chmod +x vendor/ffmpeg
          file vendor/ffmpeg
          vendor/ffmpeg -version | head -1

      - name: Build the .app bundle
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir \
            --name "$APP_NAME" \
            --osx-bundle-identifier "net.ndxvo.esp32converter" \
            --add-binary "vendor/ffmpeg:." \
            --hidden-import "PIL._tkinter_finder" \
            ndxvo_converter.py

      - name: Write the version into Info.plist
        # Must happen before signing - editing a bundle invalidates its signature.
        run: |
          V="${{ needs.preflight.outputs.version }}"
          PLIST="dist/$APP_NAME.app/Contents/Info.plist"
          plutil -replace CFBundleShortVersionString -string "$V" "$PLIST"
          plutil -replace CFBundleVersion -string "$V" "$PLIST"
          plutil -p "$PLIST" | grep -i bundle

      - name: Ad-hoc sign the bundle
        # Without a signature macOS refuses to launch an app that contains an
        # unsigned helper binary.  This is not notarisation - see the README for
        # the one-off quarantine step users need on first launch.
        run: |
          codesign --force --deep --sign - "dist/$APP_NAME.app"
          codesign --verify --deep --strict --verbose=2 "dist/$APP_NAME.app"

      - name: Package as .dmg
        run: |
          V="${{ needs.preflight.outputs.version }}"
          mkdir -p dmg out
          cp -R "dist/$APP_NAME.app" dmg/
          ln -s /Applications "dmg/Applications"
          hdiutil create -volname "$APP_NAME" -srcfolder dmg -ov -format UDZO \
            "out/NDXVO-Media-Converter-$V-macOS-arm64.dmg"
          ls -la out/

      - name: Verify ffmpeg is inside the .app inside the .dmg
        # Mounts the finished disk image and runs the ffmpeg that is actually
        # shipped, so a build can never be published with ffmpeg missing.
        run: |
          V="${{ needs.preflight.outputs.version }}"
          DMG="out/NDXVO-Media-Converter-$V-macOS-arm64.dmg"
          MP="$(mktemp -d)"
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$MP"
          FF="$MP/$APP_NAME.app/Contents/Frameworks/ffmpeg"
          if [ ! -x "$FF" ]; then
            echo "::error::ffmpeg is NOT inside the app bundle shipped in the .dmg"
            find "$MP/$APP_NAME.app" -name 'ffmpeg*' -print || true
            hdiutil detach "$MP" || true
            exit 1
          fi
          echo "Bundled ffmpeg: $(stat -f%z "$FF") bytes"
          "$FF" -version | head -1
          echo "App bundle total: $(du -sh "$MP/$APP_NAME.app" | cut -f1)"
          hdiutil detach "$MP"

      - uses: actions/upload-artifact@v7
        with:
          name: macos-arm64-dmg-${{ needs.preflight.outputs.version }}
          path: "out/*.dmg"

  # -------------------------------------------------------------- Windows ---
  windows:
    name: Windows (x64)
    needs: preflight
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Stamp the version into the app
        shell: bash
        run: python .github/scripts/stamp_version.py "${{ needs.preflight.outputs.version }}"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow pyinstaller "imageio-ffmpeg==$env:IMAGEIO_FFMPEG_VERSION"

      - name: Extract the static ffmpeg binary
        run: |
          $ff = python -c "import imageio_ffmpeg, sys; sys.stdout.write(imageio_ffmpeg.get_ffmpeg_exe())"
          New-Item -ItemType Directory -Force -Path vendor | Out-Null
          Copy-Item $ff vendor\ffmpeg.exe
          .\vendor\ffmpeg.exe -version | Select-Object -First 1

      - name: Build the .exe
        run: |
          pyinstaller --noconfirm --clean --windowed --onefile `
            --name "$env:APP_NAME" `
            --add-binary "vendor/ffmpeg.exe;." `
            --hidden-import "PIL._tkinter_finder" `
            ndxvo_converter.py

      - name: Collect the artifact
        shell: bash
        run: |
          mkdir -p out
          mv "dist/$APP_NAME.exe" \
             "out/NDXVO-Media-Converter-${{ needs.preflight.outputs.version }}-Windows-x64.exe"
          ls -la out/

      - name: Verify ffmpeg is inside the .exe
        # Reads the PyInstaller CArchive appended to the one-file executable and
        # asserts ffmpeg.exe is one of its entries.
        shell: bash
        run: |
          EXE="out/NDXVO-Media-Converter-${{ needs.preflight.outputs.version }}-Windows-x64.exe"
          ls -l "$EXE"
          python -m PyInstaller.utils.cliutils.archive_viewer --list --brief "$EXE" \
            | tr ',' '\n' | grep -qi 'ffmpeg\.exe' \
            || { echo "::error::ffmpeg.exe is NOT embedded in the one-file .exe"; exit 1; }
          echo "ffmpeg.exe is embedded in the one-file executable."

      - uses: actions/upload-artifact@v7
        with:
          name: windows-x64-exe-${{ needs.preflight.outputs.version }}
          path: "out/*.exe"

  # -------------------------------------------------------------- release ---
  # Runs only after BOTH builds succeed, so a tag is never created for a version
  # that failed to build on one of the platforms.
  release:
    name: Tag and publish
    needs: [preflight, macos, windows]
    if: needs.preflight.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v7
        with:
          path: assets
          merge-multiple: true

      - name: Show what will be published
        run: ls -la assets

      - name: Create the tag
        # On a tag push the tag already exists; only a manual run creates one.
        if: github.event_name == 'workflow_dispatch'
        run: |
          TAG="v${{ needs.preflight.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
          echo "Created and pushed $TAG at ${{ github.sha }}"

      - name: Publish the release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "v${{ needs.preflight.outputs.version }}"
          name: "v${{ needs.preflight.outputs.version }}"
          files: assets/*
          fail_on_unmatched_files: true
