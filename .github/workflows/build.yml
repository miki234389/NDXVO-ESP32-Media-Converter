name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to stamp into the app — MAJOR.MINOR.PATCH, optionally with a pre-release suffix. Examples: 1.0.0, 1.2.3, 2.0.0-rc1, 1.4.0-beta.2. Do NOT put a leading "v".'
        required: true
        default: "1.0.0"

env:
  APP_NAME: "NDXVO ESP32 File Converter"
  PYTHON_VERSION: "3.12"
  # Static ffmpeg comes from the imageio-ffmpeg wheels: one pinned version,
  # native binaries for both targets, no scraping of ad-hoc download pages.
  IMAGEIO_FFMPEG_VERSION: "0.6.0"

jobs:
  # ---------------------------------------------------------------- macOS ---
  macos:
    name: macOS (Apple Silicon)
    runs-on: macos-14          # arm64 runner
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Resolve version
        id: ver
        shell: bash
        run: bash .github/scripts/resolve-version.sh
        env:
          INPUT_VERSION: ${{ inputs.version }}

      - name: Stamp the version into the app
        shell: bash
        run: python .github/scripts/stamp_version.py "${{ steps.ver.outputs.version }}"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow pyinstaller "imageio-ffmpeg==${IMAGEIO_FFMPEG_VERSION}"

      - name: Extract the static ffmpeg binary
        run: |
          FF="$(python -c 'import imageio_ffmpeg, sys; sys.stdout.write(imageio_ffmpeg.get_ffmpeg_exe())')"
          cp "$FF" ./ffmpeg
          chmod +x ./ffmpeg
          file ./ffmpeg
          ./ffmpeg -version | head -1

      - name: Build the .app bundle
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir \
            --name "$APP_NAME" \
            --osx-bundle-identifier "net.ndxvo.esp32converter" \
            --add-binary "ffmpeg:." \
            --hidden-import "PIL._tkinter_finder" \
            ndxvo_converter.py

      - name: Write the version into Info.plist
        # Must happen before signing - editing a bundle invalidates its signature.
        run: |
          V="${{ steps.ver.outputs.version }}"
          PLIST="dist/$APP_NAME.app/Contents/Info.plist"
          plutil -replace CFBundleShortVersionString -string "$V" "$PLIST"
          plutil -replace CFBundleVersion -string "$V" "$PLIST"
          plutil -p "$PLIST" | grep -i bundle

      - name: Ad-hoc sign the bundle
        # Without a signature macOS refuses to launch an app that contains an
        # unsigned helper binary.  This is not notarisation - see the README for
        # the one-off quarantine step users need on first launch.
        run: |
          codesign --force --deep --sign - "dist/$APP_NAME.app"
          codesign --verify --deep --strict --verbose=2 "dist/$APP_NAME.app"

      - name: Package as .dmg
        run: |
          V="${{ steps.ver.outputs.version }}"
          mkdir -p dmg
          cp -R "dist/$APP_NAME.app" dmg/
          ln -s /Applications "dmg/Applications"
          hdiutil create -volname "$APP_NAME" -srcfolder dmg -ov -format UDZO \
            "NDXVO-ESP32-File-Converter-$V-macOS-arm64.dmg"

      - uses: actions/upload-artifact@v7
        with:
          name: macos-arm64-dmg-${{ steps.ver.outputs.version }}
          path: "*.dmg"
          # exactly one file per build, so hand it over as-is instead of a zip
          archive: false

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: "*.dmg"

  # -------------------------------------------------------------- Windows ---
  windows:
    name: Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Resolve version
        id: ver
        shell: bash
        run: bash .github/scripts/resolve-version.sh
        env:
          INPUT_VERSION: ${{ inputs.version }}

      - name: Stamp the version into the app
        shell: bash
        run: python .github/scripts/stamp_version.py "${{ steps.ver.outputs.version }}"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow pyinstaller "imageio-ffmpeg==$env:IMAGEIO_FFMPEG_VERSION"

      - name: Extract the static ffmpeg binary
        run: |
          $ff = python -c "import imageio_ffmpeg, sys; sys.stdout.write(imageio_ffmpeg.get_ffmpeg_exe())"
          Copy-Item $ff .\ffmpeg.exe
          .\ffmpeg.exe -version | Select-Object -First 1

      - name: Build the .exe
        run: |
          pyinstaller --noconfirm --clean --windowed --onefile `
            --name "$env:APP_NAME" `
            --add-binary "ffmpeg.exe;." `
            --hidden-import "PIL._tkinter_finder" `
            ndxvo_converter.py

      - name: Rename artifact
        shell: bash
        run: |
          mv "dist/$APP_NAME.exe" \
             "NDXVO-ESP32-File-Converter-${{ steps.ver.outputs.version }}-Windows-x64.exe"

      - uses: actions/upload-artifact@v7
        with:
          name: windows-x64-exe-${{ steps.ver.outputs.version }}
          path: "*.exe"
          # exactly one file per build, so hand it over as-is instead of a zip
          archive: false

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: "*.exe"
