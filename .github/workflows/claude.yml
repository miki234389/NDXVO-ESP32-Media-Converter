name: Claude

# Mention @claude in an issue or pull request and Claude picks up the task.
#
# Two things must be in place before this workflow does anything:
#   1. The Claude GitHub App installed on this repository — https://github.com/apps/claude
#   2. A repository secret holding the credential, see the `with:` block below.
#
# Running `/install-github-app` inside Claude Code does both automatically and
# opens a PR with this file; everything here is the manual equivalent.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

# One Claude at a time per issue or pull request. Mentioning @claude again while
# a run is still going cancels the old one, so a correction replaces the work in
# progress instead of racing it — two runs pushing to the same branch is worse
# than losing a half-finished answer.
concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude:
    # Each event carries the text in a different place, so the mention has to be
    # looked for in each one. Without this the runner would start on every
    # comment in the repository and immediately exit.
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))

    runs-on: ubuntu-latest
    timeout-minutes: 30          # guard against a runaway job burning Actions minutes

    permissions:
      contents: write            # commit and push changes
      pull-requests: write       # open PRs, comment on them
      issues: write              # reply on issues
      id-token: write            # required for the action's GitHub App authentication
      actions: read              # read CI results on pull requests

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          # Authenticates against a Claude subscription. Generate the token with
          # `claude setup-token` and store it as the CLAUDE_CODE_OAUTH_TOKEN secret.
          #
          # To bill through the Claude API instead, replace this line with:
          #   anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
